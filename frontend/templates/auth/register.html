<!-- frontend/templates/auth/register.html -->

{% extends "base.html" %}
{% block title %}Регистрация — {{ project_name }}{% endblock %}
{% block content %}
<div class="auth-container" hx-history="false">
	<h2>Создание аккаунта</h2>
	<div id="message-box" aria-live="polite"></div>
	<div id="resend-section" class="hidden" hidden></div>
	
	<form id="register-form" action="/auth/register" method="post" hx-post="/auth/register"
	      hx-ext="json-enc" hx-swap="none" hx-disabled-elt="find button">
		<label for="register-nickname">Никнейм</label>
		<input id="register-nickname" type="text" name="nickname" required minlength="3" maxlength="32" autocomplete="nickname">
		<label for="register-email">Email</label>
		<input id="register-email" type="email" name="email" required autocomplete="email">
		<label for="register-password">Пароль</label>
		<input id="register-password" type="password" name="password" required minlength="8" maxlength="128" autocomplete="new-password">
		<p>От 8 до 128 символов, хотя бы одна латинская буква и цифра.</p>
		
		<label class="form-check">
			<input type="checkbox" name="accepted_terms" value="true" required id="accept-terms">
			<span>
                Я согласен с
                <a href="/terms" target="_blank" rel="noopener noreferrer">пользовательским соглашением</a>
                и <a href="/privacy-policy" target="_blank" rel="noopener noreferrer">политикой конфиденциальности</a>
            </span>
		</label>
		<button type="submit">Зарегистрироваться</button>
	</form>
	
	<p><a href="/login">Уже есть аккаунт? Вход</a></p>
</div>
{% endblock %}
