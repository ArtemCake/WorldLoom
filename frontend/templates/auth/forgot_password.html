<!-- frontend/templates/auth/forgot_password.html -->

{% extends "base.html" %}
{% block title %}Восстановление пароля — {{ project_name }}{% endblock %}
{% block content %}
<div class="auth-container" hx-history="false">
	<h2>Восстановление пароля</h2>
	<p>Укажи email аккаунта, чтобы запросить ссылку для сброса пароля.</p>
	<div id="message-box" aria-live="polite"></div>
	
	<form action="/auth/forgot-password" method="post" hx-post="/auth/forgot-password"
	      hx-swap="none" hx-disabled-elt="find button">
		<label for="recovery-email">Email</label>
		<input id="recovery-email" type="email" name="email" required autocomplete="username">
		<button type="submit">Отправить ссылку</button>
	</form>
	
	<p><a href="/login">Вспомнил пароль? Войти</a></p>
</div>
{% endblock %}
